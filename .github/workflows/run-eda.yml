name: Execute EDA notebook

on:
  push:
    paths:
      - '.github/workflows/run-eda.yml'
      - 'notebooks/MIMICIII_Sepsis3_EDA.ipynb'
      - 'data/**'

permissions:
  contents: write

jobs:
  execute-eda:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib jupyter nbconvert ipykernel

      - name: Execute EDA notebook in place
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/MIMICIII_Sepsis3_EDA.ipynb \
            --inplace \
            --ExecutePreprocessor.timeout=300

      - name: Commit executed notebook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/MIMICIII_Sepsis3_EDA.ipynb
          if git diff --cached --quiet; then
            echo 'No notebook changes to commit.'
          else
            git commit -m 'Save executed EDA notebook outputs'
            git push
          fi
